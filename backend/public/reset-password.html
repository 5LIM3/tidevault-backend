<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset your TideVault password</title>
<style>
  body{margin:0;background:#0b0d14;color:#e8e9ee;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .box{max-width:340px;width:100%;background:#12141d;border:1px solid #232636;border-radius:12px;padding:24px;}
  h2{margin-top:0;font-size:16px;}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #232636;background:#0e101a;color:#e8e9ee;font-size:14px;margin-bottom:10px;box-sizing:border-box;}
  button{width:100%;cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;background:#8b5cf6;color:#fff;}
  .msg{color:#8b8fa3;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
  <div class="box">
    <h2>Set a new password</h2>
    <input type="password" id="newPassword" placeholder="New password (min 6 characters)">
    <button id="submitBtn">Reset Password</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const API_BASE = location.origin + '/api';
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const msg = document.getElementById('msg');

    if (!token) msg.textContent = 'Missing or invalid reset link.';

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const newPassword = document.getElementById('newPassword').value;
      msg.textContent = 'Submitting...';
      try {
        const res = await fetch(API_BASE + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        msg.textContent = 'Password updated. You can close this tab and log in.';
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
